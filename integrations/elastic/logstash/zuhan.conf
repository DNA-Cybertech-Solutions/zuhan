# ZUHAN -> Logstash -> Elasticsearch
#
# Receives the records ZUHAN forwards (zuhan -forward URL, or ZUHAN_FORWARD_URL)
# and writes them to two places:
#   zuhan-lookups-YYYY.MM.dd  every lookup, whatever the verdict (history)
#   zuhan-ti                  malicious IOCs only, as ECS threat.indicator.*,
#                             one document per IOC (a repeat lookup updates it)
#
# Environment variables (Logstash reads ${VAR:default}):
#   ES_HOSTS     Elasticsearch URL          (default http://localhost:9200)
#   ES_USER      Elasticsearch user         (default elastic)
#   ES_PASSWORD  Elasticsearch password
#
# Check the file before loading it:
#   bin/logstash --config.test_and_exit -f zuhan.conf

input {
  http {
    host => "0.0.0.0"
    port => 8080
    # To require a password, uncomment both lines and forward to
    # http://zuhan:<password>@<logstash-host>:8080
    # user     => "zuhan"
    # password => "${ZUHAN_HTTP_PASSWORD}"
  }
}

filter {
  # The http input adds details about the request itself; they are not part
  # of the lookup.
  mutate { remove_field => ["headers", "http", "url", "user_agent", "host"] }

  # Anything that is not a ZUHAN record is ignored.
  if ![zuhan][ioc] { drop {} }

  # Event time = when ZUHAN looked the IOC up.
  date { match => ["[zuhan][ts]", "ISO8601"] }

  if [zuhan][verdict] == "malicious" {
    mutate {
      add_field => {
        "[event][kind]"        => "enrichment"
        "[event][category]"    => "threat"
        "[event][type]"        => "indicator"
        "[threat][feed][name]" => "ZUHAN"
      }
      copy => {
        "[zuhan][sources]"   => "[threat][indicator][provider]"
        "[zuhan][reference]" => "[threat][indicator][reference]"
      }
    }

    date { match => ["[zuhan][ts]", "ISO8601"] target => "[threat][indicator][last_seen]" }
    if [zuhan][first_seen] {
      date { match => ["[zuhan][first_seen]", "ISO8601"] target => "[threat][indicator][first_seen]" }
    }

    # The ECS field depends on the IOC type.
    if [zuhan][ioc_type] == "ip" {
      mutate { add_field => {
        "[threat][indicator][type]" => "%{[zuhan][type]}-addr"
        "[threat][indicator][ip]"   => "%{[zuhan][ioc]}"
      } }
    } else if [zuhan][ioc_type] == "domain" {
      mutate { add_field => {
        "[threat][indicator][type]"        => "domain-name"
        "[threat][indicator][url][domain]" => "%{[zuhan][ioc]}"
      } }
    } else if [zuhan][ioc_type] == "url" {
      mutate { add_field => {
        "[threat][indicator][type]"      => "url"
        "[threat][indicator][url][full]" => "%{[zuhan][ioc]}"
      } }
    } else if [zuhan][ioc_type] == "hash" {
      mutate { add_field => {
        "[threat][indicator][type]"                         => "file"
        "[threat][indicator][file][hash][%{[zuhan][type]}]" => "%{[zuhan][ioc]}"
      } }
    }

    # ECS confidence is a word, not a number.
    if [zuhan][confidence] >= 75 {
      mutate { add_field => { "[threat][indicator][confidence]" => "High" } }
    } else if [zuhan][confidence] >= 50 {
      mutate { add_field => { "[threat][indicator][confidence]" => "Medium" } }
    } else {
      mutate { add_field => { "[threat][indicator][confidence]" => "Low" } }
    }

    # Same IOC -> same document id, so a repeat lookup updates instead of duplicating.
    fingerprint { source => "[zuhan][ioc]" target => "[@metadata][fp]" method => "SHA1" }
  }
}

output {
  elasticsearch {
    hosts    => ["${ES_HOSTS:http://localhost:9200}"]
    user     => "${ES_USER:elastic}"
    password => "${ES_PASSWORD}"
    index    => "zuhan-lookups-%{+YYYY.MM.dd}"
  }
  if [zuhan][verdict] == "malicious" {
    elasticsearch {
      hosts       => ["${ES_HOSTS:http://localhost:9200}"]
      user        => "${ES_USER:elastic}"
      password    => "${ES_PASSWORD}"
      index       => "zuhan-ti"
      document_id => "%{[@metadata][fp]}"
    }
  }
}
